<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideMenu</title>
    <link rel="stylesheet" href="sideMenu.css">
    <script src="sideMenu.js" defer></script>
    <link href='https://fonts.googleapis.com/css?family=Pixelify Sans' rel='stylesheet'>
</head>
<body>
  <div id="follower"></div>
    <div id="menu">
      <p id="money">0$</p>
      <div id="items">
        <div class="top">
          <div class="item" id="seed">
            <button ><img src="\Drawings\ActualDrawings\wheatSeeds.png"></button>
            <p>Seeds:15$</p>
          </div>
        <div class="item" id="hammer">
            <button ><img src="\Drawings\ActualDrawings\hammer2.png"></button>

          </div>
        </div>
        <div class="bottom" id="water">
          <div class="item">
            <button ><img src="\Drawings\ActualDrawings\wateringCan.png"></button>
            <p>Water:14$</p>
          </div>
          <div class="item" id="fertilizer">
            <button ><img src="\Drawings\ActualDrawings\fertilizer3.png"></button>
            <p>Fertilizer:10$</p>
          </div>
          <div class="item" id="pesticide">
            <button ><img src="\Drawings\ActualDrawings\wheatSeeds.png"></button>
            <p>Pesticide:20$</p>
          </div>
        </div>
        </div>
    </div>
    <button id="arrow"></button>
