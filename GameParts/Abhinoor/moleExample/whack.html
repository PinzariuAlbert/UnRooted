<!DOCTYPE html>
<html>
<head>
<title>Wack-A-Mole</title>
<style>
.square{position: absolute;
    background-color: rgb(87, 46, 8);
    width: 110px;
    height:  110px;
    border-radius: 45%;
    z-index: 1;
}
.A2{
    left: 18%;
}
.A3{
    left: 36%;
}
.B1{
    top: 18%;
}
.B2{
    top: 18%;
    left: 18%;
}
.B3{
    top: 18%;
    left: 36%;
}
.C1{
    top: 36%;
}
.C2{
    top: 36%;
    left: 18%;
}
.C3{
    top: 36%;
    left: 36%;
}
img{
    position: absolute;
    z-index: 1;
}
.info{
    position: absolute;
    top: 50%;
    left: 10%;
}
body{
    background-color: rgb(167, 115, 48);
}
.cd{
    position: absolute;
    top: 40%;
    left: 70%;
}
    </style>
</head>
<body>
<div class="A1 square" id="A1"></div>
<div class="A2 square" id="A2"></div>
<div class="A3 square" id="A3"></div>
<div class="B1 square" id="B1"></div>
<div class="B2 square" id="B2"></div>
<div class="B3 square" id="B3"></div>
<div class="C1 square" id="C1"></div>
<div class="C2 square" id="C2"></div>
<div class="C3 square" id="C3"></div>


<div class="info">
<button id="start" onclick="move()">start</button>
Missed:
<input type="text" readonly="readonly" id="missed" size="3"></input>
Hit:
<input type="text" readonly="readonly" id="hit" size="3"></input>
</div>
<input type="text" readonly="readonly" id="CountDown" class="cd" size="3"></input>

<img width="90px" height="90px" src="mole.png" id="image" onclick="hit_move()">
    <script src="whackamole.js"></script>
</body>
</html>
