<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideMenu</title>
    <link rel="stylesheet" href="sideMenu.css">
    <link rel="stylesheet" href="combat/mole.css">
    <script src="sideMenu.js" defer></script>
    <script src="combat/mole.js" defer></script>
    <link href='https://fonts.googleapis.com/css?family=Pixelify Sans' rel='stylesheet'>
</head>
<body>
    <div id="menu">
      <p id="money">0$</p>
      <div id="items">
        <div class="top">
          <div class="item" id="seed">
            <button ><img src="/mergeAlbertAbhinoor/ActualDrawings/wheatSeeds.png"></button>
            <p>Seeds:15$</p>
          </div>
        <div class="item" id="hammeritem">
            <button><img id="hammer-icon" src="/mergeAlbertAbhinoor/ActualDrawings/hammer1.png"></button>
            <p id="hammer-label">upgrade: 50$</p>
          </div>
        </div>
        <div class="bottom" >
          <div class="item" id="wateritem">
            <button ><img src="/mergeAlbertAbhinoor/ActualDrawings/wateringCan.png"></button>
            <p>Water:14$</p>
          </div>
          <div class="item" id="fertilizeritem">
            <button ><img src="/mergeAlbertAbhinoor/ActualDrawings/fertilizer3.png"></button>
            <p>Fertilizer:10$</p>
          </div>
          <div class="item" id="pesticideitem">
            <button ><img src="/mergeAlbertAbhinoor/ActualDrawings/pesticide.png"></button>
            <p>Pesticide:20$</p>
          </div>
        </div>
        </div>

        <div id="options">
          <div id="top">
            <button class="optionButton"><img src="/mergeAlbertAbhinoor/ActualDrawings/soundbutton.png"></button>
            <button class="optionButton"><img src="/mergeAlbertAbhinoor/ActualDrawings/exitbutton.png"></button>
          </div>
          <div id="bottom">
            <button class="optionButton"><img src="/mergeAlbertAbhinoor/ActualDrawings/tutorial.png"></button>
          </div>
        </div>
    </div>
    <button id="arrow"></button>


  <div id="board"></div>

</body>
</html>
